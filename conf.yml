# BigQuery CDC Demo Configuration - Pub/Sub to BigQuery
# All settings can be customized here

# GCP Project Configuration
gcp:
  project_id: "du-hast-mich"
  region: "us-central1"
  service_account_path: "~/workspace/google/sa.json"

# Pub/Sub Configuration
pubsub:
  topic_name: "dingocdc-items"
  subscription_name: "dingocdc-items-sub"
  ack_deadline_seconds: 60
  message_retention_duration: "604800s" # 7 days
  retain_acked_messages: false

# BigQuery Configuration
bigquery:
  dataset: "dingocdc"
  table_name: "item"
  # Location for the dataset
  location: "US"

# Dataflow Configuration
dataflow:
  job_name: "dingo-pubsub-cdc"
  # Worker configuration
  num_workers: 1
  max_workers: 2
  machine_type: "e2-medium"
  # Streaming mode for CDC
  streaming: true
  # Temp location for Dataflow
  temp_location_suffix: "dataflow/temp"
  # Staging location for Dataflow
  staging_location_suffix: "dataflow/staging"

# Client Streaming Event Generator Configuration
generator:
  interval_min_seconds: 1.0
  interval_max_seconds: 3.0
  delete_ratio: 0.15 # ~15% of events are DELETEs, rest are INSERT/UPDATE (UPSERT)
  initial_items_count: 10
